<!DOCTYPE html>
<html lang="zh-CN" data-theme="">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>Minecraft AI 伙伴 · 控制面板</title>

    <!-- 骨架页：零内联 JS/CSS。改一行刷新即生效，绿色分发包不带前端构建链。
         唯一外部脚本是 mindserver 自带的 socket.io 客户端；它加载失败时
         lib/socket.js 会自动退化成「仅 REST」模式，面板照样能用。 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232fbf7f'/%3E%3Cpath d='M9 12h14M9 17h14M9 22h8' stroke='%2306120c' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/components.css">
</head>
<body>
    <a class="skip" href="#view">跳到主内容</a>

    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="m21 16-9 5-9-5V8l9-5 9 5z"/><polyline points="3 8 12 13 21 8"/>
                    <line x1="12" y1="13" x2="12" y2="21"/>
                </svg>
            </span>
            <span>
                <span class="brand-name">Minecraft AI 伙伴</span>
                <span class="brand-sub" id="brandSub">控制面板</span>
            </span>
        </div>

        <nav class="tabs" id="nav" aria-label="主导航"></nav>

        <div class="topbar-right">
            <span class="conn" id="connBadge" title="与本机服务的连接状态">
                <span class="dot" id="connDot"></span><span id="connText">连接中…</span>
            </span>
            <button class="btn icon ghost" id="themeBtn" type="button" title="切换主题（跟随系统 / 暗色 / 亮色）"
                    aria-label="切换主题"></button>
        </div>
    </header>

    <div id="banner" class="banner hidden" role="status"></div>

    <main class="view" id="view" tabindex="-1">
        <div class="card"><div class="skeleton" style="height:18px;width:35%"></div>
            <div class="skeleton mt-3" style="height:14px;width:60%"></div>
            <div class="skeleton mt-3" style="height:14px;width:45%"></div>
        </div>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./app.js"></script>
</body>
</html>
